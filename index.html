<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Selector - Goodluck!</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Hide scrollbars due to bouncing ball */
            background: #111827; /* Dark background */
        }
        /* Container for the bouncing ball to cover the whole screen */
        #ball-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Allows clicks to go through to the form */
            z-index: 0;
        }
        /* The "kap.png" ball simulation - RETAINS USER'S 500x500 SIZE */
        #ball {
            position: absolute;
            width: 500px; /* User set to 500px */
            height: 500px; /* User set to 500px */
            /* Using a placeholder image URL for reliable display */
            background-image: url('kap.png');
            background-size: cover; /* Ensure the image fills the container */
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.8), 0 0 30px rgba(239, 68, 68, 0.5);
            will-change: transform;
        }
        #app-content {
            z-index: 10;
            position: relative;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <!-- Bouncing Ball Container and Element -->
    <div id="ball-container">
        <div id="ball"></div>
    </div>

    <!-- Main Application Content (Form/Quiz Selector) -->
    <div id="app-content" class="p-6 md:p-10 w-full max-w-md bg-white/10 backdrop-blur-md rounded-xl shadow-2xl border border-white/20">
        <div id="main-ui">
            <!-- Content loaded by JavaScript -->
        </div>
    </div>

    <!-- Firebase SDK Imports (Boilerplate) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase Initialization ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};

        let app, db, auth, userId;

        async function initializeFirebase() {
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }
                userId = auth.currentUser?.uid || crypto.randomUUID();
                console.log("Firebase initialized. User ID:", userId);

            } catch (error) {
                console.error("Error initializing Firebase:", error);
            }
        }

        window.addEventListener('load', initializeFirebase);
    </script>

    <!-- Application Logic (UI & Animation) -->
    <script>
        let userName = '';
        let currentView = 'nameEntry'; // 'nameEntry' or 'quizSelection'
        const uiContainer = document.getElementById('main-ui');

        // --- Bouncing Ball Logic (Simulating kap.png movement) ---
        const ball = document.getElementById('ball');
        const container = document.getElementById('ball-container');
        let x = 50; // Initial x position (px)
        let y = 50; // Initial y position (px)
        let dx = 1; // Initial direction (x)
        let dy = 1; // Initial direction (y)
        
        // FIX: Updated ballSize to 500 to match the CSS dimensions for correct bouncing
        const ballSize = 500; 
        
        let lastTime = 0;
        const speed = 200; // px per second

        function animateBall(timestamp) {
            if (!container || !ball) return;

            const deltaTime = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;

            // Update position
            x += dx * speed * deltaTime;
            y += dy * speed * deltaTime;

            // Collision detection (bouncing off walls)
            if (x + ballSize > containerWidth) {
                x = containerWidth - ballSize;
                dx = -Math.abs(dx); // Reverse x direction
            } else if (x < 0) {
                x = 0;
                dx = Math.abs(dx); // Reverse x direction
            }

            if (y + ballSize > containerHeight) {
                y = containerHeight - ballSize;
                dy = -Math.abs(dy); // Reverse y direction
            } else if (y < 0) {
                y = 0;
                dy = Math.abs(dy); // Reverse y direction
            }

            // Apply transformation
            ball.style.transform = `translate(${x}px, ${y}px)`;

            requestAnimationFrame(animateBall);
        }

        // --- DOWNLOAD LOGIC ---

        /**
         * Function to simulate the download of the reviewer files.
         * Creates two temporary anchor tags and clicks them to trigger a browser download.
         */
        function downloadReviewer() {
            // Helper function to create and trigger a download
            function triggerDownload(filename, content) {
                const element = document.createElement('a');
                // Use a simple data URI (text/plain) to create a downloadable file with the correct name
                // The browser will save this file, named as 'filename'.
                element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(content));
                element.setAttribute('download', filename);

                element.style.display = 'none';
                document.body.appendChild(element);

                element.click();

                document.body.removeChild(element);
            }

            // Trigger downloads for both requested files (secu.docx and rod.docx)
            triggerDownload('secu.docx', 'Content for Maam Diane Exam Reviewer - P.S. Wag ka na magpuyat!');
            triggerDownload('rod.docx', 'Content for Sir Rodlin Exam Reviewer - Good luck!');

            console.log("Download function triggered for secu.docx and rod.docx");
        }
        
        // Expose function to global scope so it can be called from the onclick attribute
        window.downloadReviewer = downloadReviewer;

        // --- UI Rendering Functions ---

        function renderNameEntry() {
            uiContainer.innerHTML = `
                <h1 class="text-3xl font-black text-white mb-6 text-center">QUIZ START</h1>
                <form id="name-form" class="space-y-6">
                    <div>
                        <!-- Requested label text -->
                        <label for="name" class="block text-sm font-bold text-red-400 mb-2 uppercase tracking-wider">
                            LAGAY MO PANGALAN MO KING INA MO.
                        </label>
                        <input type="text" id="name" name="name" required placeholder="Type your name here..."
                               class="w-full px-4 py-3 bg-white/10 text-white rounded-lg border border-red-500/50 focus:border-red-400 focus:ring-1 focus:ring-red-400 transition shadow-lg"
                               minlength="2">
                    </div>
                    <button type="submit"
                            class="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg shadow-xl transition transform hover:scale-[1.02] active:scale-95">
                        CONTINUE
                    </button>
                </form>
            `;

            document.getElementById('name-form').addEventListener('submit', handleNameSubmit);
        }

        function handleNameSubmit(event) {
            event.preventDefault();
            const input = document.getElementById('name');
            userName = input.value.trim();
            if (userName) {
                currentView = 'quizSelection';
                renderUI();
            }
        }

        function renderQuizSelection() {
            // Requested welcome message
            const welcomeMessage = `WELCOME ${userName.toUpperCase()} KINGINAMO! PUMILI KA NG QUIZ GOODLUCK!`;

            uiContainer.innerHTML = `
                <h1 class="text-3xl font-black text-white mb-4 text-center">QUIZ SELECTION</h1>
                <p class="text-lg font-bold text-red-400 mb-8 text-center border-b-2 border-red-500 pb-3">
                    ${welcomeMessage}
                </p>

                <div class="space-y-4 mb-8">
                    <!-- Quiz Options -->
                    <button onclick="startQuiz('Maam Diane Exam', 'secu.html')"
                            class="w-full py-4 bg-red-500 hover:bg-red-600 text-white font-extrabold rounded-xl shadow-lg transition transform hover:-translate-y-1 active:scale-95">
                        Maam Diane Exam
                    </button>
                    <button onclick="startQuiz('Sir Rodlin Exam', 'rod.html')"
                            class="w-full py-4 bg-red-500 hover:bg-red-600 text-white font-extrabold rounded-xl shadow-lg transition transform hover:-translate-y-1 active:scale-95">
                        Sir Rodlin Exam
                    </button>
                </div>

                <!-- NEW DOWNLOAD SECTION -->
                <div class="p-4 bg-red-800/20 rounded-xl border-2 border-red-700/50 text-center space-y-3">
                    <p class="text-white font-black text-lg">
                        HINDI KA NAGREVIEW?
                    </p>
                    <p class="text-red-300 font-semibold text-sm">
                        Click download para ma-download mo yung reviewer KINGINAMO!.
                    </p>
                    <button onclick="downloadReviewer()"
                            class="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-black rounded-lg shadow-xl transition transform hover:scale-[1.02] active:scale-95 uppercase tracking-wider flex items-center justify-center">
                        <span class="text-2xl mr-2">⬇️</span> DOWNLOAD REVIEWER
                    </button>
                </div>
                <!-- END NEW DOWNLOAD SECTION -->
            `;
        }

        /**
         * IMMEDIATELY performs navigation to the target HTML file.
         * @param {string} quizName - The displayed name of the exam (unused for navigation).
         * @param {string} fileName - The target file name (e.g., secu.html, rod.html).
         */
        function startQuiz(quizName, fileName) {
            console.log(`Immediately navigating to: ${fileName} for ${quizName}`);
            // This line instantly loads the new HTML file
            window.location.href = fileName;
        }

        function renderUI() {
            if (currentView === 'nameEntry') {
                renderNameEntry();
            } else if (currentView === 'quizSelection') {
                renderQuizSelection();
            }
        }

        // Start animation and UI on window load
        window.onload = function() {
            lastTime = performance.now(); // Initialize lastTime
            requestAnimationFrame(animateBall);
            renderUI();
        };

        window.onresize = () => {
            // No need for a full re-render, ball logic handles bounds dynamically.
        };
    </script>

</body>
</html>
