        // --- Global State ---
        let currentQuestionIndex = 0;
        // Stores the user's answer and whether it was correct: { answer: 'A', correct: true/false }
        const userAnswers = new Array(quizData.length).fill(null);


        // --- DOM Elements ---
        const questionTextEl = document.getElementById('question-text');
        const answerOptionsEl = document.getElementById('answer-options');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const currentQNumEl = document.getElementById('current-q-num');
        const topicDisplayEl = document.getElementById('topic-display');
        const currentScoreEl = document.getElementById('current-score');
        const finishMessageEl = document.getElementById('finish-message');
        const finalScoreEl = document.getElementById('final-score');
        const totalQNumEl = document.getElementById('total-q-num');

        // Set total question count once
        totalQNumEl.textContent = quizData.length;


        // --- Core Functions ---

        /**
         * Renders the current question and its options, reflecting saved state (answer/feedback).
         */
        function renderQuestion() {
            if (currentQuestionIndex >= quizData.length) {
                showFinishMessage();
                return;
            }

            const currentQ = quizData[currentQuestionIndex];
            const savedAnswer = userAnswers[currentQuestionIndex];

            // 1. Update status display
            currentQNumEl.textContent = currentQuestionIndex + 1;
            questionTextEl.innerHTML = currentQ.question;
            topicDisplayEl.textContent = currentQ.topic;
            updateScoreDisplay();

            // 2. Clear and render options
            answerOptionsEl.innerHTML = '';
            const options = currentQ.options;
            const isAnswered = savedAnswer !== null;

            for (const [key, value] of Object.entries(options)) {
                const btn = document.createElement('button');
                btn.className = 'answer-button w-full text-left p-4 rounded-lg border-2 border-gray-200 bg-gray-50 hover:bg-indigo-50 hover:border-indigo-400 focus:outline-none';
                btn.textContent = `${key}. ${value}`;
                btn.dataset.key = key;

                if (isAnswered) {
                    // Apply feedback colors if already answered
                    btn.disabled = true; // Disable interaction on review
                    applyFeedbackClasses(btn, key, currentQ.answer, savedAnswer.answer);
                } else {
                    // Enable click handler for un-answered questions
                    btn.onclick = () => selectAnswer(key);
                }
                answerOptionsEl.appendChild(btn);
            }

            // 3. Update navigation buttons
            updateNavigationButtons(isAnswered);
        }

        /**
         * Selects an answer for the current question and provides visual feedback.
         * @param {string} selectedKey - The key of the selected answer (A, B, C, D).
         */
        function selectAnswer(selectedKey) {
            const currentQ = quizData[currentQuestionIndex];
            const isCorrect = selectedKey === currentQ.answer;

            // 1. Save the answer state
            userAnswers[currentQuestionIndex] = { answer: selectedKey, correct: isCorrect };

            // 2. Apply visual feedback to all buttons
            const buttons = answerOptionsEl.querySelectorAll('.answer-button');
            buttons.forEach(btn => {
                const key = btn.dataset.key;
                btn.disabled = true; // Disable all buttons immediately
                applyFeedbackClasses(btn, key, currentQ.answer, selectedKey);
            });

            // 3. Update score and navigation
            updateScoreDisplay();
            updateNavigationButtons(true);
        }

        /**
         * Applies the correct CSS classes for feedback based on the user's choice.
         * @param {HTMLElement} btn - The button element.
         * @param {string} key - The option key (A, B, C, D) for this button.
         * @param {string} correctAnswer - The correct answer key.
         * @param {string} selectedAnswer - The user's selected answer key.
         */
        function applyFeedbackClasses(btn, key, correctAnswer, selectedAnswer) {
            btn.classList.remove('bg-gray-50', 'hover:bg-indigo-50', 'hover:border-indigo-400', 'border-gray-200');

            if (key === correctAnswer) {
                // Always green for the correct answer
                btn.classList.add('correct');
            } else if (key === selectedAnswer) {
                // Red for the incorrect user answer
                btn.classList.add('wrong');
            } else {
                // Default style for unselected, incorrect options (disabled grey)
                btn.classList.add('bg-gray-50', 'border-gray-200', 'opacity-60');
            }
        }

        /**
         * Calculates and updates the score display.
         */
        function updateScoreDisplay() {
            const correctCount = userAnswers.filter(a => a && a.correct).length;
            currentScoreEl.textContent = correctCount;
        }

        /**
         * Updates the state of the Previous and Next/Check buttons.
         * @param {boolean} isAnswered - True if the current question has been answered.
         */
        function updateNavigationButtons(isAnswered) {
            // Previous Button
            prevBtn.disabled = currentQuestionIndex === 0;

            // Next Button logic
            if (currentQuestionIndex === quizData.length - 1) {
                // Last question
                nextBtn.textContent = 'Finish Quiz';
                nextBtn.onclick = () => showFinishMessage();
            } else {
                nextBtn.textContent = isAnswered ? 'Next Question' : 'Check & Next';
                nextBtn.onclick = isAnswered ? () => navigate(1) : () => checkAndMove(1);
            }

            // Ensure 'Check & Next' is enabled if not answered, otherwise 'Next Question'
            nextBtn.disabled = !isAnswered && (nextBtn.textContent === 'Next Question' || nextBtn.textContent === 'Check & Next');
            nextBtn.disabled = false; // Override: we only disable navigation buttons if we're on the last question
        }

        /**
         * Handler for the next button when the question hasn't been answered yet.
         * It tries to find a user selection before moving.
         */
        function checkAndMove(direction) {
             // If not answered, force them to pick an answer
            if (userAnswers[currentQuestionIndex] === null) {
                // We'll rely on the visual selection/feedback process to handle 'checking'
                // The `selectAnswer` function will apply feedback and update the button to 'Next Question'
                // For 'Check & Next' to be clicked, a user must have just clicked an answer button,
                // which calls selectAnswer(). If they somehow managed to click 'Check & Next' without selecting,
                // we should do nothing or prompt them.
                console.warn('Please select an answer first.');
                return;
            }

            // If answered, just navigate
            navigate(direction);
        }

        /**
         * Navigates the quiz to the next or previous question.
         * @param {number} step - The step to take (+1 for next, -1 for previous).
         */
        function navigate(step) {
            currentQuestionIndex += step;

            if (currentQuestionIndex >= quizData.length) {
                showFinishMessage();
            } else if (currentQuestionIndex < 0) {
                currentQuestionIndex = 0;
            } else {
                // Hide finish message if visible
                finishMessageEl.classList.add('hidden');
                renderQuestion();
            }
        }

        /**
         * Displays the quiz finished message.
         */
        function showFinishMessage() {
            const finalScore = userAnswers.filter(a => a && a.correct).length;
            finalScoreEl.textContent = finalScore;
            finishMessageEl.classList.remove('hidden');
        }

        /**
         * Restarts the quiz.
         * @param {boolean} isReviewMode - If true, resets currentQuestionIndex to 0 but keeps answers. If false, wipes all answers.
         */
        function restartQuiz(isReviewMode) {
            finishMessageEl.classList.add('hidden');
            currentQuestionIndex = 0;
            if (!isReviewMode) {
                // Wipe answers for a true restart
                userAnswers.fill(null);
            }
            renderQuestion();
        }


        // --- Event Listeners and Initialization ---

        // Attach global navigation listeners (they are overwritten in updateNavigationButtons for simplicity)
        // Ensure initial assignment if not already done by the renderer on load
        prevBtn.onclick = () => navigate(-1);
        nextBtn.onclick = () => checkAndMove(1);

        // Initial render
        document.addEventListener('DOMContentLoaded', renderQuestion);

    </script>
