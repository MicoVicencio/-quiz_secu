        // --- Core Quiz Logic ---
        let currentQuestionIndex = 0;
        let userAnswers = []; // Stores { answer: 'A', correct: true/false } for each question

        // Initialization function called when the script loads
        function initializeQuiz() {
            // Fill userAnswers array with placeholders for 100 questions
            for (let i = 0; i < quizData.length; i++) {
                userAnswers.push({ answer: null, correct: null });
            }
            document.getElementById('total-questions').textContent = quizData.length;
            document.getElementById('total-q-num').textContent = quizData.length;
            renderQuestion();
        }

        // Renders the current question and options to the DOM
        function renderQuestion() {
            if (currentQuestionIndex >= quizData.length) {
                showFinishMessage();
                return;
            }

            const currentQ = quizData[currentQuestionIndex];
            const answerOptionsDiv = document.getElementById('answer-options');
            const state = userAnswers[currentQuestionIndex];
            const hasAnswered = state.answer !== null;
            
            // Update Header and Footer
            document.getElementById('current-q-num').textContent = currentQuestionIndex + 1;
            document.getElementById('question-text').textContent = (currentQuestionIndex + 1) + ". " + currentQ.question;
            document.getElementById('topic-display').textContent = currentQ.topic;
            updateScoreDisplay();
            updateNavigationButtons(hasAnswered);

            // Clear previous options
            answerOptionsDiv.innerHTML = '';

            // Generate new options
            Object.keys(currentQ.options).forEach(key => {
                const optionText = currentQ.options[key];
                const button = document.createElement('button');
                button.classList.add('answer-button', 'text-left', 'px-6', 'py-4', 'bg-gray-50', 'text-gray-700', 'font-medium', 'rounded-lg', 'border', 'border-gray-200', 'hover:bg-gray-100', 'transition-colors', 'duration-200');
                button.textContent = `${key}. ${optionText}`;
                button.setAttribute('data-key', key);

                if (hasAnswered) {
                    button.disabled = true; // Disable if already answered
                    
                    if (key === currentQ.answer) {
                        button.classList.add('correct');
                    } else if (key === state.answer) {
                        button.classList.add('wrong');
                    }
                } else {
                    button.onclick = () => selectAnswer(key);
                }

                answerOptionsDiv.appendChild(button);
            });
        }

        // Handles user selecting an answer
        function selectAnswer(selectedKey) {
            const currentQ = quizData[currentQuestionIndex];
            const isCorrect = selectedKey === currentQ.answer;

            // Store the answer and result
            userAnswers[currentQuestionIndex] = {
                answer: selectedKey,
                correct: isCorrect
            };

            // Provide visual feedback and disable buttons
            const buttons = document.querySelectorAll('#answer-options button');
            buttons.forEach(button => {
                const key = button.getAttribute('data-key');
                button.disabled = true;

                if (key === currentQ.answer) {
                    button.classList.add('correct');
                } else if (key === selectedKey) {
                    button.classList.add('wrong');
                }
            });

            // Update score and navigation state
            updateScoreDisplay();
            updateNavigationButtons(true);
        }

        // Navigates between questions
        function navigate(direction) {
            if (direction === 'prev' && currentQuestionIndex > 0) {
                currentQuestionIndex--;
            } else if (direction === 'next') {
                if (currentQuestionIndex < quizData.length - 1) {
                    currentQuestionIndex++;
                } else {
                    showFinishMessage();
                    return;
                }
            }
            renderQuestion();
        }

        // Shows the final score message
        function showFinishMessage() {
            const finalScore = userAnswers.filter(a => a.correct).length;
            document.getElementById('final-score').textContent = finalScore;
            document.getElementById('finish-message').classList.remove('hidden');
        }

        // Restarts the quiz
        function restartQuiz(reviewMode) {
            document.getElementById('finish-message').classList.add('hidden');
            if (reviewMode) {
                // If in review mode, keep answers but start from the beginning
                currentQuestionIndex = 0;
            } else {
                // If restarting fully, clear all answers
                currentQuestionIndex = 0;
                userAnswers = userAnswers.map(() => ({ answer: null, correct: null }));
            }
            renderQuestion();
        }

        // Updates the score display in the header
        function updateScoreDisplay() {
            const correctCount = userAnswers.filter(a => a.correct).length;
            document.getElementById('current-score').textContent = correctCount;
        }
        
        // Updates the state of the navigation buttons
        function updateNavigationButtons(hasAnswered) {
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');

            // Previous button logic
            prevBtn.disabled = currentQuestionIndex === 0;
            prevBtn.onclick = () => navigate('prev');

            // Next button logic
            if (currentQuestionIndex < quizData.length - 1) {
                nextBtn.textContent = hasAnswered ? 'Next Question' : 'Check & Next';
                nextBtn.disabled = !hasAnswered; // Must answer before going to next (unless reviewing)
            } else {
                nextBtn.textContent = hasAnswered ? 'Finish Quiz' : 'Check & Finish';
                nextBtn.disabled = !hasAnswered; // Must answer the last question to finish
            }
            nextBtn.onclick = () => navigate('next');
        }

        // Initialize the quiz on page load
        window.onload = initializeQuiz;
    </script>
